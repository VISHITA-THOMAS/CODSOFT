<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Currency Converter</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="card">
    <h1>Currency Converter</h1>
    <p class="subtitle">Real-time exchange rates</p>

    <div class="form-group">
      <label>Amount</label>
      <input type="number" id="amount" value="1" min="0" step="any" placeholder="Enter amount"/>
    </div>

    <div class="row">
      <div class="form-group">
        <label>From</label>
        <select id="from"></select>
      </div>
      <button class="swap-btn" onclick="swapCurrencies()" title="Swap">⇄</button>
      <div class="form-group">
        <label>To</label>
        <select id="to"></select>
      </div>
    </div>

    <button class="convert-btn" onclick="convert()">Convert</button>

    <div class="result" id="result" style="display:none">
      <div class="result-amount" id="resultAmount"></div>
      <div class="result-rate" id="resultRate"></div>
    </div>

    <div class="error" id="error" style="display:none"></div>
    <div class="loader" id="loader" style="display:none">Fetching rates…</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
